name: Apply v0.68 Engineering Integration

on:
  push:
    branches:
      - chatgpt/v068-engineering-vvuq
    paths:
      - 'scripts/apply_v068_engineering_integration.py'
      - '.github/workflows/apply-v068-engineering-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v068-engineering-vvuq
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas plotly
      - name: Apply integration patch
        run: python scripts/apply_v068_engineering_integration.py
      - name: Validate engineering source
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_engineering.py src-tauri/resources/ui/physical_lab_visualization_engineering.py src-tauri/resources/ui/physical_lab_advanced.py scripts/engineering_reference_validation.py
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          python scripts/engineering_reference_validation.py
          python scripts/reference_validation.py --check
          python scripts/digital_twin_reference_validation.py --check
          python scripts/local_ai_reference_validation.py
          python scripts/self_check.py
      - name: Commit integrated source
        run: |
          set -euo pipefail
          git config user.name 'Physical Lab CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src-tauri/resources/ui/physical_lab_advanced.py
          git commit -m 'Integrate Engineering VVUQ across advanced Labs'
          git push origin HEAD:chatgpt/v068-engineering-vvuq
