name: Integrate Risk Economics Layer

on:
  push:
    branches: [ feature/risk-economics-layer ]
    paths:
      - .github/workflows/integrate-risk-economics.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/risk-economics-layer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded integration
        run: |
          python scripts/_integrate_risk_economics.py
          python -m py_compile src-tauri/resources/ui/physical_lab_risk_economics.py src-tauri/resources/ui/physical_lab_risk_economics_ui.py scripts/risk_economics_validation.py scripts/risk_economics_wiring_validation.py
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          python scripts/risk_economics_validation.py
          python scripts/risk_economics_wiring_validation.py
          python scripts/self_check.py
      - name: Commit validated integration and remove temporary driver
        run: |
          rm scripts/_integrate_risk_economics.py
          rm .github/workflows/integrate-risk-economics.yml
          git config user.name physical-lab-ci
          git config user.email physical-lab-ci@users.noreply.github.com
          git add -A
          git commit -m "Integrate Risk and Economics into shared Evidence Center"
          git push origin HEAD:feature/risk-economics-layer
