name: Apply v0.63 Parameter Guides

on:
  push:
    branches:
      - chatgpt/v063-parameter-guide-coverage
    paths:
      - 'scripts/apply_v063_parameter_guides.py'
      - 'scripts/fix_v063_validation.py'
      - '.github/workflows/apply-v063-parameter-guides.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v063-parameter-guide-coverage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply seven-Lab guide patch
        run: |
          python scripts/apply_v063_parameter_guides.py
          python scripts/fix_v063_validation.py
      - name: Validate integrated source
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_local_ai.py scripts/local_ai_reference_validation.py
          python scripts/local_ai_reference_validation.py
          python scripts/reference_validation.py --check
          python scripts/digital_twin_reference_validation.py --check
          python scripts/self_check.py
      - name: Commit integrated source only
        run: |
          set -euo pipefail
          git config user.name 'Physical Lab CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src-tauri/resources/ui/physical_lab_local_ai.py scripts/local_ai_reference_validation.py docs/LOCAL_AI_TUTOR.md
          git commit -m 'Expand Local AI parameter semantics across seven Labs'
          git push origin HEAD:chatgpt/v063-parameter-guide-coverage
