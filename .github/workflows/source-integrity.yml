name: Source Integrity

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validation dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy plotly
      - name: Python syntax
        run: |
          python -m py_compile scripts/prepare.py scripts/self_check.py scripts/version_consistency.py scripts/reference_validation.py scripts/digital_twin_reference_validation.py scripts/accelerator_reference_benchmark.py scripts/engineering_workflow_reference_validation.py scripts/model_engineering_reference_validation.py scripts/model_campaign_reference_validation.py scripts/job_worker_control_validation.py scripts/credibility_passport_validation.py scripts/claim_evidence_validation.py scripts/evidence_review_validation.py scripts/evidence_center_ui_validation.py scripts/engineering_decision_validation.py scripts/engineering_decision_wiring_validation.py scripts/operations_planning_validation.py scripts/operations_planning_wiring_validation.py scripts/quality_reliability_validation.py scripts/quality_reliability_wiring_validation.py scripts/risk_economics_validation.py scripts/risk_economics_wiring_validation.py scripts/requirements_verification_validation.py scripts/requirements_verification_wiring_validation.py scripts/v010_release_readiness_validation.py scripts/project_unification_validation.py scripts/desktop_canonical_project_store_validation.py scripts/canonical_project_discovery_validation.py scripts/rust_canonical_read_paths_validation.py scripts/rust_canonical_dataset_analysis_validation.py scripts/rust_canonical_run_pipeline_writes_validation.py scripts/rust_canonical_campaign_writes_validation.py scripts/rust_canonical_measurement_import_validation.py scripts/rust_canonical_repro_export_validation.py scripts/rust_canonical_serial_capture_validation.py scripts/research_runtime_support_validation.py scripts/experiment_kernel_compute_validation.py scripts/physics_application_modes_validation.py scripts/engineering_scenario_layer_validation.py scripts/project_kernel_validation.py scripts/measurement_calibration_validation.py scripts/diagnostics_log_validation.py scripts/bundled_model_labs_validation.py scripts/kerr_geodesic_validation.py scripts/kerr_platform_workflow_validation.py scripts/solar_system_dynamics_validation.py scripts/honeycomb_lattice_validation.py scripts/new_model_refinement_validation.py scripts/physical_lab_project_cli.py scripts/physical_lab_compute_cli.py scripts/physical_lab_credibility_cli.py scripts/physical_lab_claims_cli.py scripts/physical_lab_evidence_review_cli.py scripts/measured_field_radiation_validation.py scripts/physical_lab_digital_twin_cli.py scripts/local_ai_reference_validation.py scripts/engineering_reference_validation.py scripts/visualization_reference_validation.py scripts/engineering_visualization_validation.py scripts/nonlinear_tolerance_validation.py scripts/radia_radiation_propagation_validation.py src-tauri/resources/safe_engine_server.py
          python -m py_compile src-tauri/resources/ui/*.py
      - name: Rust research syntax
        run: |
          rustfmt --edition 2021 --emit stdout src-tauri/src/lib.rs >/dev/null
          rustfmt --edition 2021 --emit stdout src-tauri/src/research.rs >/dev/null
          rustfmt --edition 2021 --emit stdout src-tauri/src/research_runtime_support.rs >/dev/null
          rustfmt --edition 2021 --emit stdout src-tauri/src/research_legacy_impl.rs >/dev/null
      - name: Generated artifact guard
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo 'Tracked Python bytecode/generated cache files are not allowed.' >&2
            exit 1
          fi
      - name: JSON manifests
        run: |
          python -m json.tool src-tauri/resources/modules.json >/dev/null
          python -m json.tool src-tauri/resources/dependencies.json >/dev/null
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          python -m json.tool docs/reference-validation.json >/dev/null
          python -m json.tool docs/digital-twin-reference-validation.json >/dev/null
          python -m json.tool docs/accelerator-reference-benchmark.json >/dev/null
          python -m json.tool docs/engineering-workflow-reference-validation.json >/dev/null
          python -m json.tool docs/model-engineering-reference-validation.json >/dev/null
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check dist/app.js
      - name: Release version consistency
        run: python scripts/version_consistency.py
      - name: Deterministic reference validation
        run: |
          python scripts/reference_validation.py --check
          python scripts/digital_twin_reference_validation.py --check
          python scripts/accelerator_reference_benchmark.py --check
          python scripts/engineering_workflow_reference_validation.py --check
          python scripts/model_engineering_reference_validation.py --check
          python scripts/model_campaign_reference_validation.py
          python scripts/job_worker_control_validation.py
          python scripts/credibility_passport_validation.py
          python scripts/claim_evidence_validation.py
          python scripts/evidence_review_validation.py
          python scripts/evidence_center_ui_validation.py
          python scripts/engineering_decision_validation.py
          python scripts/engineering_decision_wiring_validation.py
          python scripts/operations_planning_validation.py
          python scripts/operations_planning_wiring_validation.py
          python scripts/quality_reliability_validation.py
          python scripts/quality_reliability_wiring_validation.py
          python scripts/risk_economics_validation.py
          python scripts/risk_economics_wiring_validation.py
          python scripts/requirements_verification_validation.py
          python scripts/requirements_verification_wiring_validation.py
          python scripts/v010_release_readiness_validation.py
          python scripts/project_unification_validation.py
          python scripts/desktop_canonical_project_store_validation.py
          python scripts/canonical_project_discovery_validation.py
          python scripts/rust_canonical_read_paths_validation.py
          python scripts/rust_canonical_dataset_analysis_validation.py
          python scripts/rust_canonical_run_pipeline_writes_validation.py
          python scripts/rust_canonical_campaign_writes_validation.py
          python scripts/rust_canonical_measurement_import_validation.py
          python scripts/rust_canonical_repro_export_validation.py
          python scripts/rust_canonical_serial_capture_validation.py
          python scripts/research_runtime_support_validation.py
          python scripts/experiment_kernel_compute_validation.py
          python scripts/physics_application_modes_validation.py
          python scripts/engineering_scenario_layer_validation.py
          python scripts/project_kernel_validation.py
          python scripts/measurement_calibration_validation.py
          python scripts/diagnostics_log_validation.py
          python scripts/bundled_model_labs_validation.py
          python scripts/kerr_geodesic_validation.py
          python scripts/kerr_platform_workflow_validation.py
          python scripts/solar_system_dynamics_validation.py
          python scripts/honeycomb_lattice_validation.py
          python scripts/new_model_refinement_validation.py
          python scripts/local_ai_reference_validation.py
          python scripts/engineering_reference_validation.py
          python scripts/visualization_reference_validation.py
          python scripts/engineering_visualization_validation.py
          python scripts/nonlinear_tolerance_validation.py
          python scripts/radia_radiation_propagation_validation.py
      - name: Physical Lab self-check
        run: python scripts/self_check.py
