name: Canonical Run Pipeline Cutover

on:
  push:
    branches: [ feature/rust-canonical-run-pipeline-writes ]
    paths:
      - .github/workflows/canonical-run-pipeline-cutover.yml

permissions:
  contents: write

jobs:
  apply-cutover:
    if: contains(github.event.head_commit.message, 'Apply canonical run and pipeline write cutover')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rust-canonical-run-pipeline-writes
      - name: Apply mechanical cutover
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          source_path = root / 'src-tauri/src/research.rs'
          read_validation_path = root / 'scripts/rust_canonical_read_paths_validation.py'
          validation_path = root / 'scripts/rust_canonical_run_pipeline_writes_validation.py'
          text = source_path.read_text(encoding='utf-8')

          def replace_rust_fn(text: str, name: str, replacement: str) -> str:
              marker = f'pub fn {name}('
              start = text.index(marker)
              attr = text.rfind('#[tauri::command]', 0, start)
              brace = text.index('{', start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return text[:attr] + replacement.rstrip() + '\n' + text[i+1:]
              raise RuntimeError(name)

          helper_marker = 'fn modules_root_for_research('
          if helper_marker not in text:
              helpers = r'''
          fn modules_root_for_research(app: &AppHandle) -> Result<PathBuf, String> {
              Ok(app_root(app)?.join("modules"))
          }

          fn command_text(program: &str, args: &[&str]) -> Option<String> {
              let out = Command::new(program).args(args).output().ok()?;
              if !out.status.success() {
                  return None;
              }
              Some(String::from_utf8_lossy(&out.stdout).trim().to_string())
          }

          fn command_text_in(dir: &Path, program: &str, args: &[&str]) -> Option<String> {
              let out = Command::new(program).current_dir(dir).args(args).output().ok()?;
              if !out.status.success() {
                  return None;
              }
              Some(String::from_utf8_lossy(&out.stdout).trim().to_string())
          }

          fn touch_project_after_direct_write(project_dir: &Path, canonical: bool) -> Result<(), String> {
              let path = project_dir.join("project.json");
              let mut project = read_json(&path)?;
              if canonical && is_canonical(&project) {
                  project["updated_at"] = Value::String(now_iso());
                  if let Some(object) = project.as_object_mut() {
                      object.remove("updatedAt");
                  }
              } else {
                  project["updatedAt"] = Value::String(now_iso());
              }
              write_json(&path, &project)
          }

          fn pipeline_template_value(kind: &str) -> Value {
              match kind {
                  "accelerator-measurement" => json!({"schema":"physical-lab-pipeline-v1","name":"Measured Field → RADIA → Radiation","steps":[
                      {"id":"measurement","type":"dataset","label":"Measured magnetic field","status":"input"},
                      {"id":"compare","type":"validation","label":"Measurement vs RADIA field","status":"ready"},
                      {"id":"radia","type":"lab","moduleId":"radia-magnet-studio","mode":"full","label":"RADIA field model","status":"user-run"},
                      {"id":"trajectory","type":"handoff","label":"Field → trajectory","status":"schema-ready"},
                      {"id":"radiation","type":"lab","moduleId":"radiation-platform","mode":"full","label":"Trajectory → radiation","status":"user-run"}
                  ],"note":"Physical Lab records and validates handoffs. Current Streamlit Labs retain ownership of their solvers; module stages are not silently auto-driven."}),
                  "oscillation-modal" => json!({"schema":"physical-lab-pipeline-v1","name":"Oscillation → Chrono::Modal Comparison","steps":[
                      {"id":"osc","type":"lab","moduleId":"oscillation-integration","label":"Numerical oscillator","status":"user-run"},
                      {"id":"matrix","type":"interchange","label":"Mass / stiffness / damping package","status":"schema-ready"},
                      {"id":"modal","type":"adapter","adapterId":"chrono-modal","label":"Chrono::Modal provider","status":"adapter-boundary"},
                      {"id":"compare","type":"validation","label":"Eigenfrequency / response comparison","status":"ready"}
                  ],"note":"Chrono::Modal is not treated as a current Lab dependency until a real solver adapter consumes the interchange package."}),
                  "atomistic-magnetism" => json!({"schema":"physical-lab-pipeline-v1","name":"Material Inputs → VAMPIRE → Result Import","steps":[
                      {"id":"material","type":"interchange","label":"Material / lattice / temperature / field","status":"schema-ready"},
                      {"id":"vampire","type":"adapter","adapterId":"vampire","label":"VAMPIRE runtime","status":"adapter-boundary"},
                      {"id":"results","type":"dataset","label":"Magnetization result import","status":"ready"}
                  ],"note":"No fake atomistic solver is provided. Physical Lab prepares the contract and provenance boundary for a future validated adapter."}),
                  _ => json!({"schema":"physical-lab-pipeline-v1","name":"Measurement → Validation","steps":[
                      {"id":"measurement","type":"dataset","label":"Measurement dataset","status":"input"},
                      {"id":"analysis","type":"results","label":"Statistics / uncertainty","status":"ready"},
                      {"id":"validation","type":"validation","label":"Observed vs reference","status":"ready"}
                  ]})
              }
          }

          fn record_run_snapshot_to_dir(
              app: &AppHandle,
              project_dir: &Path,
              canonical: bool,
              module_id: &str,
              mode: &str,
              parameters_json: String,
              results_json: String,
          ) -> Result<String, String> {
              let ts = format!(
                  "{}-{}",
                  Local::now().format("%Y%m%d-%H%M%S"),
                  Local::now().timestamp_subsec_millis()
              );
              let id = format!("{}-{}", safe_slug(module_id), ts);
              let run_dir = project_dir.join("runs").join(&id);
              fs::create_dir_all(&run_dir).map_err(|e| e.to_string())?;
              let parameters: Value = serde_json::from_str(&parameters_json)
                  .unwrap_or_else(|_| json!({"raw":parameters_json}));
              let results: Value = serde_json::from_str(&results_json)
                  .unwrap_or_else(|_| json!({"raw":results_json}));
              let module_dir = modules_root_for_research(app)?.join(module_id);
              let source = module_dir.join("source");
              let source_commit = if source.exists() {
                  command_text_in(&source, "git", &["rev-parse", "HEAD"])
              } else {
                  None
              };
              let python_path = module_dir.join(".venv/bin/python");
              let python = if python_path.exists() {
                  command_text(python_path.to_string_lossy().as_ref(), &["--version"])
              } else {
                  None
              };
              let pip_freeze = if python_path.exists() {
                  command_text(
                      python_path.to_string_lossy().as_ref(),
                      &["-m", "pip", "freeze", "--all"],
                  )
              } else {
                  None
              };
              write_json(
                  &run_dir.join("run.json"),
                  &json!({
                      "schema":"physical-lab-run-v1",
                      "id":&id,
                      "createdAt":now_iso(),
                      "moduleId":module_id,
                      "mode":mode,
                      "parameters":parameters,
                      "results":results,
                      "provenance":{"sourceCommit":source_commit,"python":python,"pipFreeze":pip_freeze}
                  }),
              )?;
              touch_project_after_direct_write(project_dir, canonical)?;
              Ok(id)
          }

          fn save_pipeline_to_dir(
              project_dir: &Path,
              canonical: bool,
              kind: &str,
          ) -> Result<String, String> {
              let value = pipeline_template_value(kind);
              let id = format!(
                  "{}-{}",
                  safe_slug(kind),
                  Local::now().format("%Y%m%d-%H%M%S")
              );
              write_json(
                  &project_dir.join("pipelines").join(format!("{id}.json")),
                  &value,
              )?;
              touch_project_after_direct_write(project_dir, canonical)?;
              Ok(id)
          }

          '''
              text = text.replace('fn list_run_snapshots_from_dir(', helpers + 'fn list_run_snapshots_from_dir(', 1)

          text = replace_rust_fn(text, 'record_run_snapshot', r'''#[tauri::command]
          pub fn record_run_snapshot(
              app: AppHandle,
              workspace_id: String,
              module_id: String,
              mode: String,
              parameters_json: String,
              results_json: String,
          ) -> Result<String, String> {
              let (dir, canonical) = resolve_project_dir(&app, &workspace_id)?;
              record_run_snapshot_to_dir(
                  &app,
                  &dir,
                  canonical,
                  &module_id,
                  &mode,
                  parameters_json,
                  results_json,
              )
          }''')

          text = replace_rust_fn(text, 'pipeline_templates', r'''#[tauri::command]
          pub fn pipeline_templates() -> Vec<Value> {
              vec![
                  pipeline_template_value("accelerator-measurement"),
                  pipeline_template_value("oscillation-modal"),
                  pipeline_template_value("atomistic-magnetism"),
                  pipeline_template_value("measurement-validation"),
              ]
          }''')

          text = replace_rust_fn(text, 'save_pipeline', r'''#[tauri::command]
          pub fn save_pipeline(app: AppHandle, workspace_id: String, kind: String) -> Result<String, String> {
              let (dir, canonical) = resolve_project_dir(&app, &workspace_id)?;
              save_pipeline_to_dir(&dir, canonical, &kind)
          }''')

          source_path.write_text(text, encoding='utf-8')

          read_validation = read_validation_path.read_text(encoding='utf-8')
          read_validation = read_validation.replace('        "record_run_snapshot",\n', '')
          read_validation = read_validation.replace('        "save_pipeline",\n', '')
          read_validation_path.write_text(read_validation, encoding='utf-8')

          validation_path.write_text(r'''#!/usr/bin/env python3
          """Acceptance checks for canonical-native Rust run/pipeline writes."""
          from __future__ import annotations

          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SOURCE = ROOT / "src-tauri/src/research.rs"
          LEGACY = ROOT / "src-tauri/src/research_legacy_impl.rs"

          def compact(value: str) -> str:
              return "".join(value.split())

          def function_block(text: str, name: str) -> str:
              marker = f"fn {name}("
              start = text.index(marker)
              brace = text.index("{", start)
              depth = 0
              for index in range(brace, len(text)):
                  if text[index] == "{": depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0: return text[start:index + 1]
              raise AssertionError(name)

          def main() -> int:
              source = SOURCE.read_text(encoding="utf-8")
              legacy = LEGACY.read_text(encoding="utf-8")

              for helper in (
                  "modules_root_for_research",
                  "touch_project_after_direct_write",
                  "pipeline_template_value",
                  "record_run_snapshot_to_dir",
                  "save_pipeline_to_dir",
              ):
                  assert f"fn {helper}(" in source, helper

              for command, helper in (
                  ("record_run_snapshot", "record_run_snapshot_to_dir"),
                  ("save_pipeline", "save_pipeline_to_dir"),
              ):
                  block = compact(function_block(source, command))
                  assert "resolve_project_dir" in block
                  assert helper in block
                  assert "ensure_alias_for_id" not in block
                  assert "legacy::" not in block

              templates = compact(function_block(source, "pipeline_templates"))
              assert "pipeline_template_value" in templates
              assert "legacy::" not in templates

              run_new = compact(function_block(source, "record_run_snapshot_to_dir"))
              run_old = compact(function_block(legacy, "record_run_snapshot"))
              for token in (
                  '"physical-lab-run-v1"',
                  '"createdAt"',
                  '"moduleId"',
                  '"parameters"',
                  '"results"',
                  '"sourceCommit"',
                  '"python"',
                  '"pipFreeze"',
                  '"pip","freeze","--all"',
                  '"rev-parse","HEAD"',
              ):
                  assert token in run_new, token
                  assert token in run_old, token

              pipeline_new = compact(function_block(source, "pipeline_template_value"))
              pipeline_old = compact(function_block(legacy, "default_pipeline_value"))
              for token in (
                  '"accelerator-measurement"',
                  '"MeasuredField→RADIA→Radiation"',
                  '"oscillation-modal"',
                  '"Oscillation→Chrono::ModalComparison"',
                  '"atomistic-magnetism"',
                  '"MaterialInputs→VAMPIRE→ResultImport"',
                  '"Measurement→Validation"',
                  '"physical-lab-pipeline-v1"',
                  '"adapter-boundary"',
                  '"schema-ready"',
              ):
                  assert token in pipeline_new, token
                  assert token in pipeline_old, token

              touch = compact(function_block(source, "touch_project_after_direct_write"))
              assert 'project["updated_at"]' in touch
              assert 'object.remove("updatedAt")' in touch
              assert 'project["updatedAt"]' in touch

              save = compact(function_block(source, "save_pipeline_to_dir"))
              assert 'project_dir.join("pipelines")' in save
              assert "touch_project_after_direct_write" in save

              assert 'Projectmetadataandprovenanceindexonly' in compact(source)
              print("Physical Lab Rust canonical run/pipeline writes: PASS")
              print("- run snapshot: direct canonical/legacy resolver, no alias")
              print("- run schema + provenance fields preserved")
              print("- pipeline templates/save share one canonical helper")
              print("- pipeline contracts preserved")
              print("- canonical updated_at / legacy updatedAt behavior preserved")
              print("Boundary: desktop run snapshots remain workflow/provenance artifacts and are not automatically canonical scientific Results.")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          ''', encoding='utf-8')
          PY
          rustfmt --edition 2021 src-tauri/src/research.rs
          python scripts/rust_canonical_read_paths_validation.py
          python scripts/rust_canonical_run_pipeline_writes_validation.py
      - name: Commit validated source changes
        run: |
          git config user.name 'physical-lab-ci'
          git config user.email 'physical-lab-ci@users.noreply.github.com'
          git add src-tauri/src/research.rs scripts/rust_canonical_read_paths_validation.py scripts/rust_canonical_run_pipeline_writes_validation.py
          git commit -m 'Move run and pipeline writes to canonical project paths'
          git push origin HEAD:feature/rust-canonical-run-pipeline-writes
