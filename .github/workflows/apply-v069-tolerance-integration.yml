name: Apply v0.69 Nonlinear Tolerance Integration

on:
  push:
    branches:
      - chatgpt/v069-nonlinear-tolerance
    paths:
      - 'scripts/apply_v069_tolerance_integration.py'
      - '.github/workflows/apply-v069-tolerance-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v069-nonlinear-tolerance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check numpy plotly
      - name: Apply integration patch
        run: python scripts/apply_v069_tolerance_integration.py
      - name: Validate integrated source
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_radia_tolerance.py src-tauri/resources/ui/physical_lab_advanced.py scripts/nonlinear_tolerance_validation.py
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          python scripts/nonlinear_tolerance_validation.py
          python scripts/engineering_reference_validation.py
          python scripts/engineering_visualization_validation.py
          python scripts/reference_validation.py --check
          python scripts/digital_twin_reference_validation.py --check
          python scripts/local_ai_reference_validation.py
          python scripts/self_check.py
      - name: Commit integrated source only
        run: |
          set -euo pipefail
          git config user.name 'Physical Lab CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src-tauri/resources/ui/physical_lab_advanced.py
          git commit -m 'Integrate nonlinear RADIA tolerance ensemble'
          git push origin HEAD:chatgpt/v069-nonlinear-tolerance
