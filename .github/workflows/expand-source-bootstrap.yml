name: Expand Physical Lab source bootstrap

on:
  push:
    paths:
      - '.source-bootstrap/part-08.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Physical Lab v0.4.1 source
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .source-bootstrap -maxdepth 1 -name 'part-*.b64' | wc -l | tr -d ' ')
          if [ "$count" != "9" ]; then
            echo "Expected 9 source chunks, found $count" >&2
            exit 1
          fi
          cat .source-bootstrap/part-*.b64 | base64 --decode > /tmp/physical-lab-source.tar.xz
          mkdir -p /tmp/physical-lab-source
          tar -xJf /tmp/physical-lab-source.tar.xz -C /tmp/physical-lab-source
          rsync -a --delete-excluded /tmp/physical-lab-source/Physical-Lab-v0.4.1/ ./

      - name: Regenerate distributable frontend and icons
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 scripts/prepare.py
          python3 scripts/self_check.py
          rm -rf .source-bootstrap

      - name: Commit expanded source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Expand complete Physical Lab v0.4.1 source tree'
          git push origin HEAD:main
