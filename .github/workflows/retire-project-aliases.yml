name: Retire Project Compatibility Aliases

on:
  push:
    branches: [ refactor/retire-project-aliases ]
    paths:
      - .github/workflows/retire-project-aliases.yml

permissions:
  contents: write

jobs:
  retire-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-project-aliases
      - name: Apply and validate retirement
        run: |
          python scripts/_retire_project_aliases.py
          rustfmt --edition 2021 src-tauri/src/research.rs
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          python scripts/rust_canonical_read_paths_validation.py
          python scripts/desktop_canonical_project_store_validation.py
          python scripts/canonical_project_discovery_validation.py
          python scripts/project_unification_validation.py
      - name: Verify retired dependencies are absent
        run: |
          if grep -R "physical_lab_workspace_aliases" -n src-tauri/resources/ui scripts --exclude=desktop_canonical_project_store_validation.py --exclude=_retire_project_aliases.py; then
            echo "workspace alias module is still referenced" >&2
            exit 1
          fi
          if grep -R "ensure_alias_for_id\|fn create_alias" -n src-tauri/src/research.rs; then
            echo "Rust compatibility alias helper remains" >&2
            exit 1
          fi
      - name: Commit validated retirement
        run: |
          rm scripts/_retire_project_aliases.py
          git config user.name physical-lab-ci
          git config user.email physical-lab-ci@users.noreply.github.com
          git add -A
          git commit -m "Retire project compatibility aliases"
          git push origin HEAD:refactor/retire-project-aliases
