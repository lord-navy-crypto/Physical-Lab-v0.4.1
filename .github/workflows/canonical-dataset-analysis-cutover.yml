name: Canonical Dataset Analysis Cutover

on:
  push:
    branches: [ feature/rust-canonical-dataset-analysis ]
    paths:
      - .github/workflows/canonical-dataset-analysis-cutover.yml

permissions:
  contents: write

jobs:
  apply-cutover:
    if: contains(github.event.head_commit.message, 'Apply canonical dataset analysis cutover workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rust-canonical-dataset-analysis
      - name: Apply mechanical cutover
        run: |
          python scripts/_apply_canonical_dataset_analysis.py
          rm scripts/_apply_canonical_dataset_analysis.py
          rustfmt --edition 2021 src-tauri/src/research.rs
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/rust_canonical_dataset_analysis_validation.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('        "200_000",\n', '')
          needle = '    new_validation = compact(function_block(source, "validate_dataset_columns_from_dir"))\n'
          insert = '''    new_parser = compact(function_block(source, "parse_csv_numeric"))\n    old_parser = compact(function_block(legacy, "parse_csv_numeric"))\n    assert "200_000" in new_parser\n    assert "200_000" in old_parser\n\n'''
          if insert not in text:
              text = text.replace(needle, insert + needle, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate patch contract before commit
        run: |
          python scripts/rust_canonical_read_paths_validation.py
          python scripts/rust_canonical_dataset_analysis_validation.py
          rustfmt --edition 2021 --emit stdout src-tauri/src/research.rs >/dev/null
      - name: Commit generated source changes
        run: |
          git config user.name 'physical-lab-ci'
          git config user.email 'physical-lab-ci@users.noreply.github.com'
          git add src-tauri/src/research.rs scripts/rust_canonical_read_paths_validation.py scripts/rust_canonical_dataset_analysis_validation.py .github/workflows/source-integrity.yml scripts/_apply_canonical_dataset_analysis.py
          git commit -m 'Move dataset analysis to canonical project paths'
          git push origin HEAD:feature/rust-canonical-dataset-analysis
