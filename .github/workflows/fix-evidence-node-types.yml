name: Fix Evidence Diff Node Types

on:
  push:
    branches: [ fix/evidence-diff-node-types ]
    paths:
      - .github/workflows/fix-evidence-node-types.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-diff-node-types
      - name: Apply regression fix
        run: |
          python - <<'PY'
          from pathlib import Path

          diff_path = Path('src-tauri/resources/ui/physical_lab_evidence_diff.py')
          text = diff_path.read_text(encoding='utf-8')
          old = '            "kind": row.get("kind"),\n'
          new = '            "kind": row.get("type") or row.get("kind"),\n'
          if text.count(old) != 1:
              raise RuntimeError('expected one Evidence Graph kind projection')
          diff_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          validation_path = Path('scripts/evidence_review_validation.py')
          validation = validation_path.read_text(encoding='utf-8')
          anchor = '        assert len(snapshot_a["snapshot_sha256"]) == 64\n'
          addition = '''        passport_for_snapshot = evidence_diff.credibility.build_credibility_passport(\n            project_dir,\n            generated_at="2026-01-01T00:00:00+00:00",\n        )\n        snapshot_node_types = {row["id"]: row["kind"] for row in snapshot_a["graph_nodes"]}\n        passport_node_types = {\n            row["id"]: row["type"]\n            for row in passport_for_snapshot["evidence_graph"]["nodes"]\n        }\n        assert snapshot_node_types == passport_node_types\n        assert snapshot_node_types and all(snapshot_node_types.values())\n'''
          if validation.count(anchor) != 1:
              raise RuntimeError('snapshot regression anchor not found')
          validation_path.write_text(validation.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY
          python -m py_compile src-tauri/resources/ui/physical_lab_evidence_diff.py scripts/evidence_review_validation.py
          python scripts/evidence_review_validation.py
      - name: Commit validated fix
        run: |
          git config user.name physical-lab-ci
          git config user.email physical-lab-ci@users.noreply.github.com
          git add src-tauri/resources/ui/physical_lab_evidence_diff.py scripts/evidence_review_validation.py
          git commit -m "Fix Evidence Diff graph node type projection"
          git push origin HEAD:fix/evidence-diff-node-types
