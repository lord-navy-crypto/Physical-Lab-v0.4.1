name: macOS Universal2 Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: macos-universal2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-universal2:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Source and reference checks
        run: |
          python scripts/version_consistency.py
          python scripts/reference_validation.py --check
          python scripts/self_check.py
          node --check web/app.js

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Install Tauri CLI dependencies
        run: npm install --no-audit --no-fund

      - name: Build Universal2 app and DMG
        run: npm run desktop:build -- --target universal-apple-darwin

      - name: Verify Universal2 executable and package
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"
          APP="$(find "$BUNDLE/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          EXE="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$EXE"
          ARCHS="$(lipo -archs "$EXE")"
          echo "Executable: $EXE"
          echo "Architectures: $ARCHS"
          [[ " $ARCHS " == *" arm64 "* ]]
          [[ " $ARCHS " == *" x86_64 "* ]]
          DMG="$(find "$BUNDLE/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG"
          RELEASE_DMG="Physical-Lab-v${{ steps.release_version.outputs.version }}-Universal2.dmg"
          RELEASE_SHA="Physical-Lab-v${{ steps.release_version.outputs.version }}-Universal2.sha256.txt"
          cp "$DMG" "$RELEASE_DMG"
          shasum -a 256 "$RELEASE_DMG" | tee "$RELEASE_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: Physical-Lab-v${{ steps.release_version.outputs.version }}-Universal2
          path: |
            Physical-Lab-v${{ steps.release_version.outputs.version }}-Universal2.dmg
            Physical-Lab-v${{ steps.release_version.outputs.version }}-Universal2.sha256.txt
          if-no-files-found: error
          retention-days: 30
