name: Apply v0.67 Visualization Studio

on:
  push:
    branches:
      - chatgpt/v067-visualization-studio
    paths:
      - 'scripts/apply_v067_visualization_studio.py'
      - '.github/workflows/apply-v067-visualization-studio.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v067-visualization-studio
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install visualization validation dependencies
        run: python -m pip install --disable-pip-version-check numpy plotly
      - name: Apply Visualization Studio patch
        run: python scripts/apply_v067_visualization_studio.py
      - name: Validate integrated source
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_visualization.py src-tauri/resources/ui/physical_lab_advanced.py scripts/visualization_reference_validation.py
          node --check web/app.js
          python scripts/visualization_reference_validation.py
          python scripts/reference_validation.py --check
          python scripts/digital_twin_reference_validation.py --check
          python scripts/local_ai_reference_validation.py
          python scripts/self_check.py
      - name: Commit integrated source only
        run: |
          set -euo pipefail
          git config user.name 'Physical Lab CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src-tauri/resources/ui/physical_lab_visualization.py src-tauri/resources/ui/physical_lab_advanced.py scripts/visualization_reference_validation.py web/index.html web/app.js web/styles.css
          git commit -m 'Add model-aware Visualization Studio and Physical Lab settings'
          git push origin HEAD:chatgpt/v067-visualization-studio
