name: Release v0.10.0 Metadata

on:
  push:
    branches: [ release/v0.10.0 ]
    paths:
      - .github/workflows/release-v010-metadata.yml

permissions:
  contents: write

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.10.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded release metadata
        run: |
          python scripts/_release_v010.py
          python -m json.tool package.json >/dev/null
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          python scripts/version_consistency.py
          python scripts/v010_release_readiness_validation.py
          python scripts/self_check.py
      - name: Commit validated release metadata
        run: |
          rm scripts/_release_v010.py
          git config user.name physical-lab-ci
          git config user.email physical-lab-ci@users.noreply.github.com
          git add VERSION package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json README.md CHANGELOG.md scripts/v010_release_readiness_validation.py scripts/_release_v010.py
          git commit -m "Prepare Physical Lab v0.10.0 release metadata"
          git push origin HEAD:release/v0.10.0
