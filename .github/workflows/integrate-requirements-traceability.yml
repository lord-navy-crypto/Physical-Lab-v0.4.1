name: Integrate Requirements Traceability Layer

on:
  push:
    branches: [ feature/requirements-traceability-layer ]
    paths:
      - .github/workflows/integrate-requirements-traceability.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/requirements-traceability-layer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded integration
        run: |
          python scripts/_integrate_requirements_traceability.py
          python -m py_compile src-tauri/resources/ui/physical_lab_requirements.py src-tauri/resources/ui/physical_lab_requirements_ui.py scripts/requirements_traceability_validation.py scripts/requirements_traceability_wiring_validation.py
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          python scripts/requirements_traceability_validation.py
          python scripts/requirements_traceability_wiring_validation.py
          python scripts/self_check.py
      - name: Commit validated non-workflow integration
        run: |
          rm scripts/_integrate_requirements_traceability.py
          git config user.name physical-lab-ci
          git config user.email physical-lab-ci@users.noreply.github.com
          git add -A -- ':!.github/workflows/integrate-requirements-traceability.yml'
          git commit -m "Integrate Requirements Traceability into shared Evidence Center"
          git push origin HEAD:feature/requirements-traceability-layer
