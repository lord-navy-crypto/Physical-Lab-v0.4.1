name: Integrate v0.10 Release Readiness

on:
  push:
    branches: [ feature/v010-release-readiness ]
    paths:
      - .github/workflows/integrate-v010-release-readiness.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v010-release-readiness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded release hardening
        run: |
          python scripts/_integrate_v010_release_readiness.py
          python -m py_compile scripts/self_check.py scripts/v010_release_readiness_validation.py
          python scripts/self_check.py
      - name: Commit validated non-workflow hardening
        run: |
          rm scripts/_integrate_v010_release_readiness.py
          git config user.name physical-lab-ci
          git config user.email physical-lab-ci@users.noreply.github.com
          git add README.md CHANGELOG.md scripts/self_check.py scripts/_integrate_v010_release_readiness.py
          git commit -m "Align v0.10 release documentation and self-check"
          git push origin HEAD:feature/v010-release-readiness
