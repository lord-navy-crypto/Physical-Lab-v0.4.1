name: Harden Research Model Builder MVP

on:
  push:
    branches: [ feature/research-model-builder-mvp ]
    paths:
      - .github/workflows/harden-model-builder-mvp.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/research-model-builder-mvp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hardening
        run: python scripts/_harden_model_builder_mvp.py
      - name: Validate hardening
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_model_builder.py scripts/model_builder_validation.py scripts/model_builder_wiring_validation.py
          python scripts/model_builder_validation.py
          python scripts/model_builder_wiring_validation.py
          python scripts/version_consistency.py
          python scripts/self_check.py
          node --check web/app.js
          rustfmt --edition 2021 --emit stdout src-tauri/src/model_builder.rs >/dev/null
      - name: Commit validated hardening
        run: |
          rm scripts/_harden_model_builder_mvp.py
          git config user.name physical-lab-ci
          git config user.email physical-lab-ci@users.noreply.github.com
          git add src-tauri/resources/ui/physical_lab_model_builder.py scripts/model_builder_validation.py web/app.js README.md CHANGELOG.md
          git add -u
          git commit -m "Harden Research Model Builder model-spec coherence"
          git push origin HEAD:feature/research-model-builder-mvp
