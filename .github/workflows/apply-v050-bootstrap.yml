name: Apply Physical Lab v0.5.0 Bootstrap

on:
  push:
    branches: [ main ]
    paths:
      - '.source-bootstrap/**'
      - '.github/workflows/apply-v050-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and apply v0.5.0 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .source-bootstrap/part-*.b64 | base64 --decode > /tmp/v050-delta.tar.xz
          echo 'd6faa09ff163c1b6615d4073fb33682c98fbafc4196e452ce4fd0656b9da53f5  /tmp/v050-delta.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v050-delta.tar.xz -C .
          rm -rf .source-bootstrap
          rm -f .github/workflows/apply-v050-bootstrap.yml
          python scripts/self_check.py
          node --check web/app.js
          node --check dist/app.js
          python -m json.tool src-tauri/resources/modules.json >/dev/null
          git config user.name 'Physical Lab Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Release Physical Lab v0.5.0 research workspace'
          git push origin main
