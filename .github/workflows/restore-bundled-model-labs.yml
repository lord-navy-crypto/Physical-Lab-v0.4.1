name: Restore Bundled Model Labs

on:
  push:
    branches: [ feature/restore-bundled-model-labs ]
    paths:
      - .github/workflows/restore-bundled-model-labs.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/restore-bundled-model-labs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validation dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Apply guarded restoration
        run: |
          python scripts/_restore_bundled_model_labs.py
          rustfmt --edition 2021 --emit stdout src-tauri/src/lib.rs >/dev/null
          python -m py_compile \
            src-tauri/resources/ui/physical_lab_builtin_lab_entry.py \
            src-tauri/resources/ui/physical_lab_new_model_refinement_ui.py \
            scripts/bundled_model_labs_validation.py
          python scripts/bundled_model_labs_validation.py
          python scripts/kerr_geodesic_validation.py
          python scripts/kerr_platform_workflow_validation.py
          python scripts/solar_system_dynamics_validation.py
          python scripts/honeycomb_lattice_validation.py
          python scripts/new_model_refinement_validation.py
          python scripts/self_check.py
      - name: Commit validated restoration
        run: |
          rm scripts/_restore_bundled_model_labs.py
          git config user.name physical-lab-ci
          git config user.email physical-lab-ci@users.noreply.github.com
          git add -A
          git commit -m "Restore Kerr Solar and Honeycomb as first-class Labs"
          git push origin HEAD:feature/restore-bundled-model-labs
