name: Apply v0.66 AI Note Browser

on:
  push:
    branches:
      - chatgpt/v066-ai-note-browser
    paths:
      - 'scripts/apply_v066_ai_note_browser.py'
      - '.github/workflows/apply-v066-ai-note-browser.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v066-ai-note-browser
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply AI note browser patch
        run: python scripts/apply_v066_ai_note_browser.py
      - name: Validate integrated source
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_local_ai.py scripts/local_ai_reference_validation.py
          python scripts/local_ai_reference_validation.py
          python scripts/reference_validation.py --check
          python scripts/digital_twin_reference_validation.py --check
          python scripts/self_check.py
      - name: Commit integrated source only
        run: |
          set -euo pipefail
          git config user.name 'Physical Lab CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src-tauri/resources/ui/physical_lab_local_ai.py scripts/local_ai_reference_validation.py docs/LOCAL_AI_TUTOR.md
          git commit -m 'Add read-only AI provenance note browser'
          git push origin HEAD:chatgpt/v066-ai-note-browser
