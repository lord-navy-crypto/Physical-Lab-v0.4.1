name: Strengthen Bundled Scientific Smokes

on:
  push:
    branches: [ feature/restore-bundled-model-labs ]
    paths:
      - .github/workflows/strengthen-bundled-smokes.yml

permissions:
  contents: write

jobs:
  strengthen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/restore-bundled-model-labs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validation dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Apply and validate smoke hardening
        run: |
          python scripts/_strengthen_bundled_smokes.py
          rustfmt --edition 2021 --emit stdout src-tauri/src/research_runtime_support.rs >/dev/null
          python scripts/bundled_model_labs_validation.py
          python scripts/kerr_geodesic_validation.py
          python scripts/solar_system_dynamics_validation.py
          python scripts/honeycomb_lattice_validation.py
          python scripts/self_check.py
      - name: Commit validated smoke hardening
        run: |
          rm scripts/_strengthen_bundled_smokes.py
          git config user.name physical-lab-ci
          git config user.email physical-lab-ci@users.noreply.github.com
          git add -A
          git commit -m "Add real smoke checks for bundled model Labs"
          git push origin HEAD:feature/restore-bundled-model-labs
