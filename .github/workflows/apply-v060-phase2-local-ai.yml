name: Apply v0.6 Phase 2 Local AI

on:
  push:
    branches:
      - chatgpt/v060-phase2-local-ai
    paths:
      - 'scripts/apply_v060_phase2_local_ai.py'
      - '.github/workflows/apply-v060-phase2-local-ai.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v060-phase2-local-ai
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: python scripts/apply_v060_phase2_local_ai.py
      - name: Validate patched source
        run: |
          python -m py_compile src-tauri/resources/ui/*.py scripts/self_check.py
          python -m json.tool src-tauri/resources/modules.json >/dev/null
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          python scripts/reference_validation.py --check
          python scripts/digital_twin_reference_validation.py --check
          python scripts/self_check.py
      - name: Commit integrated source only
        run: |
          set -euo pipefail
          find src-tauri scripts -type d -name '__pycache__' -prune -exec rm -rf {} +
          git config user.name 'Physical Lab CI'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md scripts/self_check.py src-tauri/resources/modules.json src-tauri/tauri.conf.json src-tauri/resources/ui/physical_lab_advanced.py
          git commit -m 'Integrate RADIA measurement adapter and Local AI assistant'
          git push origin HEAD:chatgpt/v060-phase2-local-ai
