name: Canonical Measurement Import Retry

on:
  push:
    branches: [ feature/rust-canonical-measurement-import ]
    paths:
      - .github/workflows/canonical-measurement-import-retry.yml

permissions:
  contents: write

jobs:
  retry-cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rust-canonical-measurement-import
      - name: Reuse cutover patch and fix validation token
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/canonical-measurement-import-cutover.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n          rustfmt --edition 2021 src-tauri/src/research.rs"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          patch = textwrap.dedent(workflow[start:end])
          exec(compile(patch, '<measurement-import-cutover>', 'exec'), {})

          validation = Path('scripts/rust_canonical_measurement_import_validation.py')
          text = validation.read_text(encoding='utf-8')
          text = text.replace(
              '\"Calibrationstatus,sensoraccuracy,traceabilityandexperimentalvalidationmustbeestablishedseparately.\"',
              'Calibrationstatus,sensoraccuracy,traceabilityandexperimentalvalidationmustbeestablishedseparately.'
          )
          validation.write_text(text, encoding='utf-8')
          PY
          rustfmt --edition 2021 src-tauri/src/research.rs
          python scripts/rust_canonical_read_paths_validation.py
          python scripts/rust_canonical_measurement_import_validation.py
      - name: Commit validated source changes
        run: |
          git config user.name 'physical-lab-ci'
          git config user.email 'physical-lab-ci@users.noreply.github.com'
          git add src-tauri/src/research.rs scripts/rust_canonical_read_paths_validation.py scripts/rust_canonical_measurement_import_validation.py
          git commit -m 'Move measurement file import to canonical project paths'
          git push origin HEAD:feature/rust-canonical-measurement-import
