name: Restore Frozen Legacy Implementation

on:
  push:
    branches: [ refactor/retire-project-aliases ]
    paths:
      - .github/workflows/revert-legacy-formatting.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-project-aliases
          fetch-depth: 0
      - name: Restore frozen legacy source from main
        run: |
          git fetch origin main
          git checkout origin/main -- src-tauri/src/research_legacy_impl.rs
          git diff --exit-code origin/main -- src-tauri/src/research_legacy_impl.rs
      - name: Commit restoration
        run: |
          git config user.name physical-lab-ci
          git config user.email physical-lab-ci@users.noreply.github.com
          git add src-tauri/src/research_legacy_impl.rs
          git commit -m "Restore frozen legacy research implementation"
          git push origin HEAD:refactor/retire-project-aliases
