name: Physical Lab Full-mode Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-mode-acceptance.yml'
      - 'src-tauri/resources/ui/physical_lab_digital_twin.py'
      - 'src-tauri/resources/ui/physical_lab_radia_radiation_propagation.py'
      - 'src-tauri/resources/ui/physical_lab_radiation_worker.py'
      - 'src-tauri/resources/modules.json'
      - 'scripts/digital_twin_reference_validation.py'
      - 'scripts/accelerator_reference_benchmark.py'
      - 'docs/digital-twin-reference-validation.json'
      - 'docs/accelerator-reference-benchmark.json'
  pull_request:
    paths:
      - '.github/workflows/full-mode-acceptance.yml'
      - 'src-tauri/resources/ui/physical_lab_radia_radiation_propagation.py'
      - 'src-tauri/resources/ui/physical_lab_radiation_worker.py'
      - 'src-tauri/resources/modules.json'
      - 'scripts/accelerator_reference_benchmark.py'
      - 'docs/accelerator-reference-benchmark.json'

permissions:
  contents: read

jobs:
  radia-full-mode:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout Physical Lab
        uses: actions/checkout@v4

      - name: Checkout pinned RADIA Universal2 builder
        uses: actions/checkout@v4
        with:
          repository: lord-navy-crypto/lord-navy-crypto-radia-universal2-macos-installer
          ref: 7ff3b2dc26cbcccfcb0aaf3c4a290ebd83439698
          path: radia-builder

      - name: Checkout pinned Radiation Platform
        uses: actions/checkout@v4
        with:
          repository: lord-navy-crypto/simulator-radiation-planfotm
          ref: 6d19b36304c9d30f9b608214f7cfb9fcbaf941d4
          path: radiation-platform

      - name: Build RADIA Universal2
        env:
          RADIA_DEST: ${{ runner.temp }}/Radia-full-ci
          PYTHON_BIN: python3
          JOBS: '3'
          PIP_BREAK_SYSTEM_PACKAGES: '1'
        run: |
          chmod +x radia-builder/install_RADIA.command
          cd radia-builder
          ./install_RADIA.command

      - name: Verify native extension architectures
        env:
          RADIA_DEST: ${{ runner.temp }}/Radia-full-ci
        run: |
          set -euo pipefail
          EXT="$(find "$RADIA_DEST/cpp/gcc" -maxdepth 1 -type f -name 'radia*.so' -print -quit)"
          test -n "$EXT"
          ARCHS="$(lipo -archs "$EXT")"
          echo "RADIA extension: $EXT"
          echo "Architectures: $ARCHS"
          echo " $ARCHS " | grep -q " arm64 "
          echo " $ARCHS " | grep -q " x86_64 "

      - name: Tiny Full-mode native field acceptance
        env:
          RADIA_DEST: ${{ runner.temp }}/Radia-full-ci
        run: |
          set -euo pipefail
          export RADIA_PYTHONPATH="$RADIA_DEST/cpp/gcc"
          export PYTHONPATH="$RADIA_PYTHONPATH:${PYTHONPATH:-}"
          python3 - <<'PY'
          import json, math
          import radia

          if hasattr(radia, 'UtiDelAll'):
              radia.UtiDelAll()

          obj = radia.ObjRecMag([0, 0, 0], [10, 10, 10], [0, 0, 1])
          assert obj is not None

          z = 20.0
          bz_plus = float(radia.Fld(obj, 'bz', [0, 0, z]))
          bz_minus = float(radia.Fld(obj, 'bz', [0, 0, -z]))
          bx_plus = float(radia.Fld(obj, 'bx', [0, 0, z]))

          assert all(math.isfinite(v) for v in (bz_plus, bz_minus, bx_plus))
          assert abs(bz_plus) > 1e-12
          symmetry_scale = max(abs(bz_plus), abs(bz_minus), 1e-15)
          axial_symmetry_error = abs(bz_plus - bz_minus) / symmetry_scale
          transverse_ratio = abs(bx_plus) / max(abs(bz_plus), 1e-15)
          assert axial_symmetry_error < 1e-9
          assert transverse_ratio < 1e-9

          result = {
              'schema': 'physical-lab-radia-full-mode-acceptance-v1',
              'builder_revision': '7ff3b2dc26cbcccfcb0aaf3c4a290ebd83439698',
              'test': 'native rectangular permanent-magnet field symmetry',
              'bz_plus': bz_plus,
              'bz_minus': bz_minus,
              'bx_plus': bx_plus,
              'axial_symmetry_relative_error': axial_symmetry_error,
              'transverse_to_axial_ratio': transverse_ratio,
              'status': 'PASS',
              'boundary': 'This validates a tiny native RADIA field path on clean macOS. It is not a validation of a specific undulator geometry or experimental magnet.'
          }
          with open('full-mode-acceptance.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, indent=2, sort_keys=True)
          print(json.dumps(result, indent=2, sort_keys=True))

          if hasattr(radia, 'UtiDelAll'):
              radia.UtiDelAll()
          PY

      - name: Prepare isolated Radiation Platform acceptance environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/radiation-acceptance-venv"
          "${RUNNER_TEMP}/radiation-acceptance-venv/bin/python" -m pip install --disable-pip-version-check --upgrade pip
          "${RUNNER_TEMP}/radiation-acceptance-venv/bin/python" -m pip install --disable-pip-version-check numpy pandas scipy matplotlib

      - name: Cross-engine 3-D field-map to trajectory/radiation acceptance
        run: |
          set -euo pipefail
          PY="${RUNNER_TEMP}/radiation-acceptance-venv/bin/python"
          WORK="${RUNNER_TEMP}/physical-lab-cross-engine"
          mkdir -p "$WORK"
          "$PY" - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          import os

          work = Path(os.environ['RUNNER_TEMP']) / 'physical-lab-cross-engine'
          x_mm = np.array([-1.0, 0.0, 1.0])
          y_mm = np.array([-1.0, 0.0, 1.0])
          z_mm = np.linspace(0.0, 80.0, 97)
          B = np.zeros((len(z_mm), len(y_mm), len(x_mm), 3), dtype=float)
          # Small regular sinusoidal planar map exercises the exact field-map
          # interface and has an independent analytic resonance reference.
          B[..., 1] = 0.05 * np.cos(2.0*np.pi*z_mm[:, None, None] / 20.0)
          np.savez_compressed(work/'cross-engine-field.npz', x_mm=x_mm, y_mm=y_mm, z_mm=z_mm, B_T=B)
          cfg = {
              'radiationPlatformSource': str(Path('radiation-platform').resolve()),
              'fieldMapNpz': str((work/'cross-engine-field.npz').resolve()),
              'periodMm': 20.0,
              'deviceName': 'cross-engine-acceptance-map',
              'gamma': 80.0,
              'nPeriods': 4,
              'pointsPerPeriod': 32,
              'observerDistanceM': 50.0,
              'thetaXMrad': 0.0,
              'thetaYMrad': 0.0,
              'sourceLabel': 'Physical Lab CI synthetic regular planar field map',
          }
          (work/'worker-config.json').write_text(json.dumps(cfg, indent=2), encoding='utf-8')
          PY
          "$PY" src-tauri/resources/ui/physical_lab_radiation_worker.py \
            --config "$WORK/worker-config.json" \
            --output "$WORK/cross-engine-worker.json"
          "$PY" - <<'PY'
          import json, math, os
          from pathlib import Path

          src = Path(os.environ['RUNNER_TEMP'])/'physical-lab-cross-engine'/'cross-engine-worker.json'
          data = json.loads(src.read_text(encoding='utf-8'))
          obs = data['observables']
          required = ['f0', 'photon_energy_eV', 'P_larmor', 'relative_linewidth', 'max_transverse_excursion_m']
          for key in required:
              value = obs.get(key)
              assert value is not None and math.isfinite(float(value)), (key, value)
          assert float(obs['f0']) > 0.0
          assert float(obs['photon_energy_eV']) > 0.0
          assert float(obs['P_larmor']) >= 0.0
          evidence = {
              'schema': 'physical-lab-cross-engine-acceptance-v1',
              'radiation_platform_revision': '6d19b36304c9d30f9b608214f7cfb9fcbaf941d4',
              'test': 'regular 3-D field map -> FieldMapInsertionDevice -> run_sim_scalar',
              'field_map': data['fieldMap'],
              'observables': obs,
              'status': 'PASS',
              'boundary': 'This validates the clean-macOS cross-engine field-map interface using a synthetic regular map. It does not validate a specific RADIA manufacturing ensemble or experimental radiation measurement.'
          }
          Path('cross-engine-acceptance.json').write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

          # Independent physics invariant: the same 0.05 T, 20 mm planar
          # sinusoidal map has a closed-form on-axis undulator resonance.
          "$PY" scripts/accelerator_reference_benchmark.py \
            --worker-output "$WORK/cross-engine-worker.json" \
            --peak-field-t 0.05 \
            --period-mm 20.0 \
            --gamma 80.0 \
            --max-relative-error 5e-4 \
            --evidence-out cross-engine-physics-benchmark.json

      - name: Accelerator analytic reference snapshot
        run: python3 scripts/accelerator_reference_benchmark.py --check

      - name: Digital-twin deterministic core
        run: python3 scripts/digital_twin_reference_validation.py --check

      - name: Upload Full-mode evidence
        uses: actions/upload-artifact@v4
        with:
          name: physical-lab-full-mode-acceptance
          path: |
            full-mode-acceptance.json
            cross-engine-acceptance.json
            cross-engine-physics-benchmark.json
          if-no-files-found: error
