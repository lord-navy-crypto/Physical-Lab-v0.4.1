name: Canonical Serial Capture Cutover

on:
  push:
    branches: [ feature/rust-canonical-serial-capture ]
    paths:
      - .github/workflows/canonical-serial-capture-cutover.yml

permissions:
  contents: write

jobs:
  apply-cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rust-canonical-serial-capture
      - name: Apply mechanical cutover
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src-tauri/src/research.rs')
          read_validation_path = Path('scripts/rust_canonical_read_paths_validation.py')
          validation_path = Path('scripts/rust_canonical_serial_capture_validation.py')
          text = source_path.read_text(encoding='utf-8')

          def replace_rust_fn(text: str, name: str, replacement: str) -> str:
              marker = f'pub fn {name}('
              start = text.index(marker)
              attr = text.rfind('#[tauri::command]', 0, start)
              brace = text.index('{', start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return text[:attr] + replacement.rstrip() + '\n' + text[i+1:]
              raise RuntimeError(name)

          if 'fn capture_serial_measurement_to_dir(' not in text:
              helper = r'''
          fn capture_serial_measurement_to_dir(
              app: &AppHandle,
              project_dir: &Path,
              canonical: bool,
              device: &str,
              baud: u32,
              seconds: u64,
              name: &str,
              quantity: &str,
              unit: &str,
              sensor: &str,
          ) -> Result<DatasetSummary, String> {
              if !device.starts_with("/dev/cu.") && !device.starts_with("/dev/tty.") {
                  return Err(
                      "Only macOS serial devices under /dev/cu.* or /dev/tty.* are accepted.".into(),
                  );
              }
              if !Path::new(device).exists() {
                  return Err("Serial device not found.".into());
              }
              let secs = seconds.clamp(1, 300);
              let baud_text = baud.to_string();
              let _ = Command::new("/bin/stty")
                  .args(["-f", device, baud_text.as_str(), "raw", "-echo"])
                  .status();
              let temporary = app_root(app)?.join(format!(
                  "serial-{}.csv",
                  Local::now().timestamp_millis()
              ));
              let code = r#"import os,sys,select,time
          p=sys.argv[1]; secs=float(sys.argv[2]); out=sys.argv[3]
          fd=os.open(p,os.O_RDONLY|os.O_NONBLOCK)
          end=time.time()+secs; buf=b''
          with open(out,'w',encoding='utf-8') as f:
           f.write('timestamp,value\n')
           while time.time()<end:
            r,_,_=select.select([fd],[],[],0.2)
            if not r: continue
            try: chunk=os.read(fd,4096)
            except BlockingIOError: continue
            if not chunk: continue
            buf+=chunk
            while b'\n' in buf:
             line,buf=buf.split(b'\n',1); s=line.decode('utf-8','ignore').strip()
             if not s: continue
             try: v=float(s.split(',')[-1].strip())
             except: continue
             f.write(f'{time.time():.6f},{v}\n'); f.flush()
          os.close(fd)
          "#;
              let python = command_text("/usr/bin/which", &["python3"])
                  .filter(|value| !value.is_empty())
                  .unwrap_or_else(|| "python3".into());
              let secs_text = secs.to_string();
              let temporary_text = temporary.to_string_lossy().to_string();
              let status = Command::new(python.trim())
                  .args([
                      "-c",
                      code,
                      device,
                      secs_text.as_str(),
                      temporary_text.as_str(),
                  ])
                  .status()
                  .map_err(|e| e.to_string())?;
              if !status.success() {
                  let _ = fs::remove_file(&temporary);
                  return Err(
                      "Serial capture failed. Check device permissions and baud rate.".into(),
                  );
              }
              let result = import_measurement_dataset_to_dir(
                  project_dir,
                  canonical,
                  temporary.to_string_lossy().as_ref(),
                  name,
                  quantity,
                  unit,
                  sensor,
                  &format!("Serial capture at {baud} baud for {secs}s"),
              );
              let _ = fs::remove_file(&temporary);
              result
          }

          '''
              text = text.replace('#[tauri::command]\npub fn create_workspace(', helper + '#[tauri::command]\npub fn create_workspace(', 1)

          text = replace_rust_fn(text, 'list_serial_devices', r'''#[tauri::command]
          pub fn list_serial_devices() -> Result<Vec<String>, String> {
              let mut output = Vec::new();
              for entry in fs::read_dir("/dev")
                  .map_err(|e| e.to_string())?
                  .filter_map(Result::ok)
              {
                  let name = entry.file_name().to_string_lossy().to_string();
                  if name.starts_with("cu.") || name.starts_with("tty.") {
                      output.push(format!("/dev/{name}"));
                  }
              }
              output.sort();
              Ok(output)
          }''')

          text = replace_rust_fn(text, 'capture_serial_measurement', r'''#[tauri::command]
          pub fn capture_serial_measurement(
              app: AppHandle,
              workspace_id: String,
              device: String,
              baud: u32,
              seconds: u64,
              name: String,
              quantity: String,
              unit: String,
              sensor: String,
          ) -> Result<DatasetSummary, String> {
              let (dir, canonical) = resolve_project_dir(&app, &workspace_id)?;
              let secs = seconds.clamp(1, 300);
              let dataset = capture_serial_measurement_to_dir(
                  &app,
                  &dir,
                  canonical,
                  &device,
                  baud,
                  seconds,
                  &name,
                  &quantity,
                  &unit,
                  &sensor,
              )?;
              if canonical {
                  register_desktop_measurement(
                      &app,
                      &workspace_id,
                      &dataset,
                      &format!(
                          "Serial capture recorded by desktop Data Bridge at {baud} baud for {secs} s."
                      ),
                  )?;
                  touch_project_after_direct_write(&dir, true)?;
              }
              Ok(dataset)
          }''')
          source_path.write_text(text, encoding='utf-8')

          read_validation = read_validation_path.read_text(encoding='utf-8')
          old = '''    for name in (\n        "capture_serial_measurement",\n    ):\n        block = compact(function_block(text, name))\n        assert "ensure_alias_for_id" in block, (\n            f"{name} still delegates through legacy storage and must create alias on demand"\n        )\n\n'''
          if old not in read_validation:
              raise RuntimeError('legacy alias assertion block not found')
          read_validation = read_validation.replace(old, '''    serial_block = compact(function_block(text, "capture_serial_measurement"))\n    assert "resolve_project_dir" in serial_block\n    assert "capture_serial_measurement_to_dir" in serial_block\n    assert "ensure_alias_for_id" not in serial_block\n    assert "legacy::" not in serial_block\n    assert text.count("ensure_alias_for_id(") == 1, "compatibility alias helper must have no command callers"\n\n''')
          read_validation = read_validation.replace(
              '    print("- legacy write/computation delegates remain on-demand only")\n',
              '    print("- no project command requires the compatibility alias helper")\n'
          )
          read_validation_path.write_text(read_validation, encoding='utf-8')

          validation_path.write_text(r'''#!/usr/bin/env python3
          """Acceptance checks for canonical-native desktop serial capture."""
          from __future__ import annotations
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SOURCE = ROOT / "src-tauri/src/research.rs"
          LEGACY = ROOT / "src-tauri/src/research_legacy_impl.rs"

          def compact(value: str) -> str:
              return "".join(value.split())

          def function_block(text: str, name: str) -> str:
              marker = f"fn {name}("
              start = text.index(marker)
              brace = text.index("{", start)
              depth = 0
              for index in range(brace, len(text)):
                  if text[index] == "{": depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0: return text[start:index + 1]
              raise AssertionError(name)

          def main() -> int:
              source = SOURCE.read_text(encoding="utf-8")
              legacy = LEGACY.read_text(encoding="utf-8")

              list_new = compact(function_block(source, "list_serial_devices"))
              list_old = compact(function_block(legacy, "list_serial_devices"))
              for token in ('fs::read_dir("/dev")', 'name.starts_with("cu.")', 'name.starts_with("tty.")', 'output.sort()'):
                  assert token in list_new, token
              for token in ('fs::read_dir("/dev")', 'name.starts_with("cu.")', 'name.starts_with("tty.")', 'out.sort()'):
                  assert token in list_old, token
              assert "legacy::" not in list_new

              command = compact(function_block(source, "capture_serial_measurement"))
              for token in (
                  'resolve_project_dir(&app,&workspace_id)',
                  'capture_serial_measurement_to_dir',
                  'ifcanonical',
                  'register_desktop_measurement',
                  'touch_project_after_direct_write(&dir,true)',
              ):
                  assert token in command, token
              assert "ensure_alias_for_id" not in command
              assert "legacy::" not in command

              helper = compact(function_block(source, "capture_serial_measurement_to_dir"))
              legacy_capture = compact(function_block(legacy, "capture_serial_measurement"))
              for token in (
                  '!device.starts_with("/dev/cu.")&&!device.starts_with("/dev/tty.")',
                  '"OnlymacOSserialdevicesunder/dev/cu.*or/dev/tty.*areaccepted."',
                  'Path::new(device).exists()',
                  'seconds.clamp(1,300)',
                  'Command::new("/bin/stty")',
                  '"-f",device',
                  '"raw","-echo"',
                  'Local::now().timestamp_millis()',
                  "fd=os.open(p,os.O_RDONLY|os.O_NONBLOCK)",
                  "select.select([fd],[],[],0.2)",
                  "f.write('timestamp,value\\n')",
                  "float(s.split(',')[-1].strip())",
                  'command_text("/usr/bin/which",&["python3"])',
                  '"Serialcapturefailed.Checkdevicepermissionsandbaudrate."',
                  'import_measurement_dataset_to_dir',
                  'format!("Serialcaptureat{baud}baudfor{secs}s")',
                  'fs::remove_file(&temporary)',
              ):
                  assert token in helper, token

              for token in (
                  '!device.starts_with("/dev/cu.")&&!device.starts_with("/dev/tty.")',
                  '"OnlymacOSserialdevicesunder/dev/cu.*or/dev/tty.*areaccepted."',
                  'Path::new(&device).exists()',
                  'seconds.clamp(1,300)',
                  'Command::new("/bin/stty")',
                  '"-f",device.as_str()',
                  '"raw","-echo"',
                  'Local::now().timestamp_millis()',
                  "fd=os.open(p,os.O_RDONLY|os.O_NONBLOCK)",
                  "select.select([fd],[],[],0.2)",
                  "f.write('timestamp,value\\n')",
                  "float(s.split(',')[-1].strip())",
                  'command_text("/usr/bin/which",&["python3"])',
                  '"Serialcapturefailed.Checkdevicepermissionsandbaudrate."',
                  'format!("Serialcaptureat{baud}baudfor{secs}s")',
                  'fs::remove_file(tmp)',
              ):
                  assert token in legacy_capture, token

              registration = compact(function_block(source, "register_desktop_measurement"))
              assert '"physical-lab-measurement-v1"' in registration
              assert '"source_type":"desktop-data-bridge"' in registration
              assert 'Calibrationstatus,sensoraccuracy,traceabilityandexperimentalvalidationmustbeestablishedseparately.' in registration

              assert source.count("ensure_alias_for_id(") == 1
              print("Physical Lab Rust canonical serial capture: PASS")
              print("- macOS /dev/cu.* and /dev/tty.* device boundary preserved")
              print("- 1–300 s clamp, stty setup and non-blocking capture preserved")
              print("- timestamp,value CSV acquisition contract preserved")
              print("- serial capture imports directly into canonical/legacy project datasets")
              print("- canonical capture registers Measurement Evidence")
              print("- no project command calls ensure_alias_for_id")
              print("Boundary: serial acquisition plus file hashing/registration does not establish sensor accuracy, calibration traceability, experimental validation, or scientific truth.")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          ''', encoding='utf-8')
          PY
          rustfmt --edition 2021 src-tauri/src/research.rs
          python scripts/rust_canonical_read_paths_validation.py
          python scripts/rust_canonical_serial_capture_validation.py
      - name: Commit validated source changes
        run: |
          git config user.name physical-lab-ci
          git config user.email physical-lab-ci@users.noreply.github.com
          git add src-tauri/src/research.rs scripts/rust_canonical_read_paths_validation.py scripts/rust_canonical_serial_capture_validation.py
          git commit -m "Move serial capture to canonical project paths"
          git push origin HEAD:feature/rust-canonical-serial-capture
