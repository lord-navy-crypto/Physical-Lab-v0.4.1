name: Apply v0.65 AI Research Notes

on:
  push:
    branches:
      - chatgpt/v065-ai-research-notes
    paths:
      - 'scripts/apply_v065_ai_research_notes_v2.py'
      - '.github/workflows/apply-v065-ai-research-notes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v065-ai-research-notes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply AI research provenance patch
        run: python scripts/apply_v065_ai_research_notes_v2.py
      - name: Validate integrated source
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_local_ai.py scripts/local_ai_reference_validation.py
          python scripts/local_ai_reference_validation.py
          python scripts/reference_validation.py --check
          python scripts/digital_twin_reference_validation.py --check
          python scripts/self_check.py
      - name: Commit integrated source only
        run: |
          set -euo pipefail
          git config user.name 'Physical Lab CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src-tauri/resources/ui/physical_lab_local_ai.py scripts/local_ai_reference_validation.py docs/LOCAL_AI_TUTOR.md
          git commit -m 'Add opt-in Local AI research provenance notes'
          git push origin HEAD:chatgpt/v065-ai-research-notes
