name: Extract Research Runtime Support

on:
  push:
    branches: [ refactor/research-runtime-support ]
    paths:
      - .github/workflows/extract-research-runtime-support.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/research-runtime-support
      - name: Extract and validate runtime support
        run: |
          python scripts/_extract_research_runtime_support.py
          rustfmt --edition 2021 --emit stdout src-tauri/src/research.rs >/dev/null
          rustfmt --edition 2021 --emit stdout src-tauri/src/research_runtime_support.rs >/dev/null
          python -m py_compile scripts/research_runtime_support_validation.py scripts/self_check.py
          python scripts/research_runtime_support_validation.py
          python scripts/self_check.py
      - name: Commit validated source changes
        run: |
          git checkout -- .github/workflows/source-integrity.yml
          rm scripts/_extract_research_runtime_support.py
          git config user.name physical-lab-ci
          git config user.email physical-lab-ci@users.noreply.github.com
          git add src-tauri/src/research.rs src-tauri/src/research_runtime_support.rs scripts/research_runtime_support_validation.py scripts/self_check.py scripts/_extract_research_runtime_support.py
          git commit -m "Separate research runtime support from frozen legacy storage"
          git push origin HEAD:refactor/research-runtime-support
